name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write # allows julia-actions/cache to delete old caches
  contents: write # allows deploydocs to push to gh-pages
  pull-requests: read # needed for push_preview = true
  statuses: write # reports the documentation build status

jobs:
  docbuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
          # Pull request previews skip the half-hour benchmark tables.
          UNROLLED_UTILITIES_BENCHMARK: ${{ github.event_name != 'pull_request' }}
        run: julia --project=docs/ docs/make.jl
