name: ci
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  merge_group:

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.13'
        os:
          - ubuntu-latest
          # There is a concurrency limit for MacOS runners across the
          # entire organization.
          # (see https://docs.github.com/en/actions/reference/limits#job-concurrency-limits-for-github-hosted-runners)
          # To help with this, MacOS runners are only run when PRs are merged
          # into the main branch.
          - ${{ github.event_name == 'push' && 'macOS-latest' || '' }}
        exclude:
          - os: ''
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests
        run: julia --project -e 'using Pkg; Pkg.test(; coverage = false)'
        # Using the julia-runtest action makes this more than 2 times slower.
